name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check and build plugin
        run: ./gradlew check buildPlugin --stacktrace

  release:
    name: Publish GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release tag
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ ! "$tag_version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(-dev)?$ ]]; then
            echo "Release tags must use vX.Y, vX.Y.Z, vX.Y-dev, or vX.Y.Z-dev, received: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          normalize_numeric_version() {
            local version="$1"
            local major minor patch extra
            IFS=. read -r major minor patch extra <<< "$version"
            if [[ -z "$major" || -z "$minor" || -n "$extra" ]]; then
              return 1
            fi
            printf '%s.%s.%s\n' "$major" "$minor" "${patch:-0}"
          }

          project_version="$(./gradlew properties --console=plain -q | grep '^version:' | cut -d' ' -f2-)"
          tag_numeric_version="$(normalize_numeric_version "${tag_version%-dev}")"
          project_numeric_version="$(normalize_numeric_version "${project_version%-dev}")"
          if [[ "$tag_numeric_version" != "$project_numeric_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $project_version." >&2
            exit 1
          fi

      - name: Build release archive
        run: ./gradlew buildPlugin --stacktrace

      - name: Create checksum
        shell: bash
        run: |
          shopt -s nullglob
          archives=(build/distributions/CodexProvider-*.zip)
          if (( ${#archives[@]} != 1 )); then
            echo "Expected exactly one CodexProvider ZIP, found ${#archives[@]}." >&2
            exit 1
          fi
          archive="${archives[0]}"
          sha256sum "$archive" > "$archive.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          shopt -s nullglob
          archives=(build/distributions/CodexProvider-*.zip)
          if (( ${#archives[@]} != 1 )); then
            echo "Expected exactly one CodexProvider ZIP, found ${#archives[@]}." >&2
            exit 1
          fi
          archive="${archives[0]}"
          release_options=(--verify-tag --generate-notes --title "Codex Provider $version")
          if [[ "$version" == *-dev ]]; then
            release_options+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$archive" \
            "$archive.sha256" \
            "${release_options[@]}"
