name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check and build plugin
        run: ./gradlew check buildPlugin --stacktrace

  release:
    name: Publish GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release tag
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ ! "$tag_version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Release tags must use vX.Y or vX.Y.Z, received: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          project_version="$(./gradlew properties --console=plain -q | grep '^version:' | cut -d' ' -f2-)"
          if [[ "$tag_version" != "$project_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $project_version." >&2
            exit 1
          fi

      - name: Build release archive
        run: ./gradlew buildPlugin --stacktrace

      - name: Create checksum
        shell: bash
        run: |
          cd build/distributions
          sha256sum CodexProvider-*.zip > CodexProvider-${GITHUB_REF_NAME#v}.zip.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="build/distributions/CodexProvider-$version.zip"
          gh release create "$GITHUB_REF_NAME" \
            "$archive" \
            "$archive.sha256" \
            --verify-tag \
            --generate-notes \
            --title "Codex Provider $version"
