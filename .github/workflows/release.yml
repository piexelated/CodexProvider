name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release tag
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ ! "$tag_version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?(-dev)?$ ]]; then
            echo "Release tags must use vX.Y, vX.Y.Z, vX.Y-dev, or vX.Y.Z-dev, received: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          normalize_numeric_version() {
            local version="$1"
            local major minor patch extra
            IFS=. read -r major minor patch extra <<< "$version"
            if [[ -z "$major" || -z "$minor" || -n "$extra" ]]; then
              return 1
            fi
            printf '%s.%s.%s\n' "$major" "$minor" "${patch:-0}"
          }

          project_version="$(sed -n 's/^version=//p' gradle.properties)"
          tag_numeric_version="$(normalize_numeric_version "${tag_version%-dev}")"
          project_numeric_version="$(normalize_numeric_version "${project_version%-dev}")"
          if [[ "$tag_numeric_version" != "$project_numeric_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $project_version." >&2
            exit 1
          fi

      - name: Select supported IDE branches
        id: targets
        run: |
          matrix="$(python3 scripts/release-artifacts.py matrix --manifest docs/compatibility-results.json)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify on ${{ matrix.os }}
    needs: targets
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Check pinned platform
        run: ./gradlew check buildPlugin verifyPluginStructure --stacktrace

  build-pairs:
    name: Build IDEA ${{ matrix.idea }} / AI ${{ matrix.ai }}
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check release tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build and test exact version pair
        env:
          IDEA_VERSION: ${{ matrix.idea }}
          AI_ASSISTANT_VERSION: ${{ matrix.ai }}
          CODEX_COMPATIBILITY_OUTPUT_DIR: ${{ runner.temp }}/tested-plugin
        run: scripts/compatibility-test.sh "$IDEA_VERSION" "$AI_ASSISTANT_VERSION"
      - name: Label archive and record verification commit
        env:
          IDEA_VERSION: ${{ matrix.idea }}
          AI_ASSISTANT_VERSION: ${{ matrix.ai }}
          TEST_SUITE_REVISION: ${{ github.sha }}
        run: |
          python3 scripts/release-artifacts.py bundle \
            --source "$RUNNER_TEMP/tested-plugin" --output release-artifacts \
            --idea "$IDEA_VERSION" --ai "$AI_ASSISTANT_VERSION" --revision "$TEST_SUITE_REVISION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.idea }}-${{ matrix.ai }}
          path: release-artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [verify, build-pairs]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true
      - name: Generate tested download index
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/release-artifacts.py notes --artifacts release-artifacts \
            --repository "$REPOSITORY" --tag "$GITHUB_REF_NAME" --output release-notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          release_options=(--verify-tag --generate-notes --notes-file release-notes.md --title "Codex Provider $version")
          if [[ "$version" == *-dev ]]; then
            release_options+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release-artifacts/* "${release_options[@]}"
