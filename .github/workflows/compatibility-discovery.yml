name: Discover JetBrains and Codex compatibility

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jetbrains-compatibility-discovery
  cancel-in-progress: false

jobs:
  discover:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.releases.outputs.matrix }}
      count: ${{ steps.releases.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check release discovery logic
        run: python3 -m unittest discover -s scripts -p 'test_compatibility_releases.py'
      - name: Find untested released versions
        id: releases
        run: |
          python3 scripts/compatibility-releases.py discover \
            --manifest docs/compatibility-results.json \
            --output "$RUNNER_TEMP/compatibility-candidates.json" \
            --github-output "$GITHUB_OUTPUT"

  test_pairs:
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test ${{ matrix.kind }} compatibility
        env:
          IDEA_VERSION: ${{ matrix.idea }}
          AI_ASSISTANT_VERSION: ${{ matrix.ai }}
          CODEX_CLI_VERSION: ${{ matrix.cli || '' }}
          TEST_SUITE_REVISION: ${{ github.sha }}
        run: |
          set +e
          if [[ -n "$CODEX_CLI_VERSION" ]]; then
            scripts/compatibility-test.sh "$IDEA_VERSION" "$AI_ASSISTANT_VERSION" 21 "$CODEX_CLI_VERSION" > compatibility.log 2>&1
          else
            scripts/compatibility-test.sh "$IDEA_VERSION" "$AI_ASSISTANT_VERSION" > compatibility.log 2>&1
          fi
          test_status=$?
          set -e
          cat compatibility.log
          python3 scripts/compatibility-releases.py result \
            --idea "$IDEA_VERSION" --ai "$AI_ASSISTANT_VERSION" \
            --cli "$CODEX_CLI_VERSION" \
            --test-suite-revision "$TEST_SUITE_REVISION" \
            --exit-code "$test_status" --log compatibility.log --output result.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: compatibility-result-${{ matrix.kind }}-${{ matrix.idea }}-${{ matrix.ai }}-${{ matrix.cli || 'none' }}
          path: |
            compatibility.log
            result.json
          if-no-files-found: error

  update-readme:
    needs: [discover, test_pairs]
    if: needs.discover.outputs.count != '0' && needs.test_pairs.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: compatibility-result-*
          path: ${{ runner.temp }}/compatibility-artifacts
      - name: Update tested results and README tables
        run: |
          python3 scripts/compatibility-releases.py merge \
            --manifest docs/compatibility-results.json \
            --readme README.md \
            --results-dir "$RUNNER_TEMP/compatibility-artifacts" \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Commit tested results to the default branch
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- README.md docs/compatibility-results.json
          if git diff --cached --quiet; then
            echo "No compatibility results changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update tested JetBrains compatibility"
          git push origin "HEAD:$TARGET_BRANCH"
