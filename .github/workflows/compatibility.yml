name: IDE compatibility

on:
  push:
    branches: [master]
    paths-ignore: &docs-only
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore: *docs-only
  workflow_dispatch:
    inputs:
      idea_version:
        description: IntelliJ IDEA version
        required: true
        default: "2026.2.2"
      ai_assistant_version:
        description: JetBrains AI Assistant plugin version
        required: true
        default: "262.10315.187"
      jvm_target:
        description: Java bytecode target (17, 21, or 25)
        required: true
        default: "21"

permissions:
  contents: read

# A new push to a pull request supersedes its running checks. Other runs get a unique group,
# so master pushes are never cancelled or dropped from the queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Check shell scripts
        run: shellcheck scripts/*.sh
      - name: Check release and discovery tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  known-pairs:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The 2026.2.2 pair runs the suite twice and downloads a real Codex CLI.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - idea: "2025.3.4.1"
            ai: "253.32098.101"
          - idea: "2025.3.6.1"
            ai: "253.33813.55"
          - idea: "2026.1.5"
            ai: "261.27258.89"
          - idea: "2026.2.2"
            ai: "262.10315.187"
          - idea: "2026.2.3"
            ai: "262.10968.147"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test IDEA ${{ matrix.idea }} with AI Assistant ${{ matrix.ai }}
        env:
          IDEA_VERSION: ${{ matrix.idea }}
          AI_ASSISTANT_VERSION: ${{ matrix.ai }}
        run: |
          if [[ "$IDEA_VERSION" == "2026.2.2" ]]; then
            scripts/verify-compatibility-suite.sh "$IDEA_VERSION" "$AI_ASSISTANT_VERSION" 0.157.1
          else
            scripts/compatibility-test.sh "$IDEA_VERSION" "$AI_ASSISTANT_VERSION"
          fi

  requested-pair:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test requested versions
        env:
          IDEA_VERSION: ${{ inputs.idea_version }}
          AI_ASSISTANT_VERSION: ${{ inputs.ai_assistant_version }}
          JVM_TARGET: ${{ inputs.jvm_target }}
        run: scripts/compatibility-test.sh "$IDEA_VERSION" "$AI_ASSISTANT_VERSION" "$JVM_TARGET"
